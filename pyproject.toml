[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "template-project"
version = "1.3.1-pre"
description = "A template to get Python projects started quickly"
authors = [{name="Giovanni Pellicciotta", email="giovanni.pellicciotta@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hinolugi-support @ git+https://github.com/gpellicciotta/hinolugi-support.python.git@v0.1.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "build>=1.0.0"]

[project.scripts]
myproject = "myproject.cli:main"

[tool.ruff]
line-length = 132

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

